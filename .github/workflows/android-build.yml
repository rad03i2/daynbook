name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffold when missing
        run: |
          flutter create \
            --platforms=android \
            --org com.rad03i2 \
            --project-name daynbook \
            .

      - name: Apply DaynBook Android settings
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission,
              )
          text = text.replace('android:label="daynbook"', 'android:label="دفتر الدين"')
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(text, encoding='utf-8')

          generated_test = Path('test/widget_test.dart')
          if generated_test.exists():
              generated = generated_test.read_text(encoding='utf-8')
              if 'MyApp' in generated and 'Counter increments smoke test' in generated:
                  generated_test.unlink()

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit generated Android platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .metadata
          if ! git diff --cached --quiet; then
            git commit -m "build(android): add Flutter Android scaffold"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --debug --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "GOOGLE_SERVER_CLIENT_ID is not configured; building APK without live Google OAuth."
            flutter build apk --debug
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/DaynBook-v0.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daynbook-debug-apk
          path: build/app/outputs/flutter-apk/DaynBook-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
