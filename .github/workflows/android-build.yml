name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffold only when missing
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --platforms=android \
              --org com.rad03i2 \
              --project-name daynbook \
              .
          fi

      - name: Install stable DaynBook development certificate
        run: |
          mkdir -p "$HOME/.android"
          cp android/app/daynbook-dev.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Show OAuth certificate fingerprints
        run: |
          echo "Android OAuth package: com.rad03i2.daynbook.dev"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'SHA1:|SHA256:'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build development APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --debug \
              --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "Google OAuth client ID is not configured yet; building the installable dev APK with cloud sign-in disabled."
            flutter build apk --debug
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/DaynBook-v0.2.0-dev-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daynbook-dev-debug-apk
          path: build/app/outputs/flutter-apk/DaynBook-v0.2.0-dev-debug.apk
          if-no-files-found: error
          retention-days: 30
